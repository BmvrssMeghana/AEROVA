services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_DB: ${POSTGRES_DB:-aerova}
      POSTGRES_USER: ${POSTGRES_USER:-aerova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      AEROVA_DB_SCHEMA: ${AEROVA_DB_SCHEMA:-aerova_website}
      AEROVA_SECRET_KEY: ${AEROVA_SECRET_KEY:-replace-with-a-long-random-secret-for-local-use}
      AEROVA_ENV: ${AEROVA_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      AEROVA_UPLOAD_DIR: /data/private_uploads
    volumes:
      - aerova-uploads:/data/private_uploads
    ports:
      - "8000:8000"
  web:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
volumes:
  aerova-uploads:
